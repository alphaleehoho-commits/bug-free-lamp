<!DOCTYPE html>
<html lang="zh-Hant" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3f5" />
    <meta name="description" content="水母深域 — 無限深海 · 收集你的水母" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <title>水母深域</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("void-tide-theme") === "dark") {
            document.documentElement.classList.remove("theme-light");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0c1218");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="theme-light" aria-live="polite">載入中…</div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("void-tide-theme") === "dark") {
            var el = document.getElementById("app");
            if (el) el.classList.remove("theme-light");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="./js/ui.js"></script>
  </body>
</html>
